### model
model_name_or_path: sample_ckpt/qwen2_5_vl/save_LoRA_Null_adapter_qwen2_5_vl_PT_274_ov_pre_64
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
print_param_status: true   # 可选：启动时打印每个参数的可训练状态，便于核对

### method
stage: sft
do_train: true
finetuning_type: full
# freeze_trainable_modules: BLinear

### dataset
dataset: kore
template: qwen2_vl
cutoff_len: 2048
max_samples: 2000000000000000000000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: qwen_train_ckpt/llama_factory/llama_factory_kore_qwen
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 24
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 6.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null